spring.config.import=optional:file:.env[.properties]

spring.application.name=obvx

# ===============================
# DATABASE POSTGRESQL (prod)
# Sans PostgreSQL en local : lancer avec le profil "dev" (base H2 en mémoire)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obvx-admin}
spring.datasource.username=${DB_username}
spring.datasource.password=${DB_password}


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CORS : adresses du front autorisées (séparées par des virgules)
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,https://obvx-street.vercel.app}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
