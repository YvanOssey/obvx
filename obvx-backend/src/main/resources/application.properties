spring.config.import=optional:file:.env[.properties]

spring.application.name=obvx

# ===============================
# DATABASE POSTGRESQL (prod)
# Sans PostgreSQL en local : lancer avec le profil "dev" (base H2 en mémoire)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obvx-admin}
spring.datasource.username=${DB_username}
spring.datasource.password=${DB_password}
# Petit pool : suffisant pour la boutique et compatible avec les offres gratuites (Neon…)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CORS : adresses du front autorisées (séparées par des virgules)
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,https://obvx-street.vercel.app}

# ===============================
# ADMINISTRATION
# Compte administrateur unique, créé au démarrage (connexion : /admin/login).
# Mot de passe oublié : changer ADMIN_PASSWORD et redémarrer. 12 caractères minimum.
# ===============================
app.admin.email=${ADMIN_EMAIL:${ADMIN_EMAILS:}}
app.admin.password=${ADMIN_PASSWORD:}

# Photos produits envoyées depuis l'espace admin (Cloudinary, optionnel)
cloudinary.url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
# Derrière le proxy HTTPS de l'hébergeur (Render) : bonnes URL et IP clientes
server.forward-headers-strategy=framework
server.compression.enabled=true
# Seul /actuator/health est exposé (sonde de l'hébergeur), sans détails
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
