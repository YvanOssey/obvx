# Profil de développement : base H2 en mémoire, aucune installation requise.
# Lancement : ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:obvx;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Secret JWT réservé au développement local (jamais en production)
JWT_SECRET=dev-only-obvx-secret-key-change-me-0123456789
