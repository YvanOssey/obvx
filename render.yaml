# Déploiement de l'API OBVX sur Render (Blueprint).
# Render > New > Blueprint > choisir ce dépôt : le service est créé à partir de ce fichier.
# Les variables marquées "sync: false" sont demandées à la création (voir DEPLOIEMENT.md).
services:
  - type: web
    name: obvx-api
    runtime: docker
    rootDir: obvx-backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_username
        sync: false
      - key: DB_password
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Emails des administrateurs (accès à /admin), séparés par des virgules
      - key: ADMIN_EMAILS
        sync: false
      # Optionnel : envoi des photos produits depuis l'admin (cloudinary://clé:secret@nom)
      - key: CLOUDINARY_URL
        sync: false
